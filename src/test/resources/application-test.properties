# Fictitious values so the context loads in tests and CI without the real cátedra environment.
catedra.api-base-url=http://localhost:8089
catedra.jwt=test-jwt
catedra.redis.host=localhost
catedra.redis.port=6379
catedra.redis.username=grp_test
catedra.redis.password=test-redis-password
catedra.redis.read-namespace=catedra:sync:*
catedra.kafka.bootstrap-servers=localhost:9092
catedra.kafka.consumer-group-id=alumnos-test
catedra.kafka.catalog-topic=catedra.catalog.test
# No broker in tests: only the Kafka integration test starts the consumer, against an embedded one.
catedra.kafka.listener-enabled=false
# No cátedra in tests: only the startup tests synchronize, against a fake one.
catedra.sync.on-startup=false
catedra.sync.poll-enabled=false
# H2 in PostgreSQL mode instead of a real PostgreSQL: the same Flyway migrations run on it.
# test.database-name lets a test that starts its own context use a database of its own.
spring.datasource.url=jdbc:h2:mem:${test.database-name:testdb};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
