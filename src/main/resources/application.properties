spring.application.name=servicio-catalogo

# 8081 by default so it does not clash with Servicio-turnos on 8080
server.port=${CATALOGO_SERVER_PORT:8081}

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Errors as application/problem+json (RFC 9457), the same format the cátedra contract uses
spring.mvc.problemdetails.enabled=true

# Integration with the cátedra service. Real values only through environment variables (see .env.example).
# The empty default makes a missing variable fail validation at startup instead of binding the literal placeholder.
catedra.api-base-url=${CATEDRA_API_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}
# The REST timeouts default to PT2S (connect) and PT10S (read, the snapshot is the heaviest response);
# CATEDRA_CONNECT_TIMEOUT and CATEDRA_READ_TIMEOUT override them (ISO-8601 duration).
# Without a local version, the catalog snapshot is loaded at startup. If the cátedra is unavailable it is retried
# up to 8 attempts, waiting PT2S and doubling up to PT60S; CATEDRA_SYNC_MAX_ATTEMPTS, CATEDRA_SYNC_INITIAL_BACKOFF and
# CATEDRA_SYNC_MAX_BACKOFF override them, and CATEDRA_SYNC_SNAPSHOT_ON_STARTUP=false skips the load.
catedra.redis.host=${CATEDRA_REDIS_HOST:}
catedra.redis.port=${CATEDRA_REDIS_PORT:}
catedra.redis.username=${CATEDRA_REDIS_USERNAME:}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD:}
catedra.redis.read-namespace=${CATEDRA_REDIS_READ_NAMESPACE:}
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.catalog-topic=${CATEDRA_KAFKA_CATALOG_TOPIC:}
