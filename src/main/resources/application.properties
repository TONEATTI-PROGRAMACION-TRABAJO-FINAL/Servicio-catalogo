spring.application.name=servicio-catalogo

# 8081 by default so it does not clash with Servicio-turnos on 8080
server.port=${CATALOGO_SERVER_PORT:8081}

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Errors as application/problem+json (RFC 9457), the same format the cátedra contract uses
spring.mvc.problemdetails.enabled=true

# Integration with the cátedra service. Real values only through environment variables (see .env.example).
# The empty default makes a missing variable fail validation at startup instead of binding the literal placeholder.
catedra.api-base-url=${CATEDRA_API_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}
# The REST timeouts default to PT2S (connect) and PT10S (read, the snapshot is the heaviest response);
# CATEDRA_CONNECT_TIMEOUT and CATEDRA_READ_TIMEOUT override them (ISO-8601 duration).
# The catalog is synchronized at startup (the snapshot without a local version). If the cátedra is unavailable it
# is retried up to 8 attempts, waiting PT2S and doubling up to PT60S; CATEDRA_SYNC_MAX_ATTEMPTS,
# CATEDRA_SYNC_INITIAL_BACKOFF and CATEDRA_SYNC_MAX_BACKOFF override them, and CATEDRA_SYNC_ON_STARTUP=false skips it.
# Every PT1M the versions are compared again and what is missing is applied; CATEDRA_SYNC_POLL_INTERVAL overrides the
# interval and CATEDRA_SYNC_POLL_ENABLED=false turns it off.
catedra.redis.host=${CATEDRA_REDIS_HOST:}
catedra.redis.port=${CATEDRA_REDIS_PORT:}
catedra.redis.username=${CATEDRA_REDIS_USERNAME:}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD:}
catedra.redis.read-namespace=${CATEDRA_REDIS_READ_NAMESPACE:}
# The Redis timeouts default to PT2S (connect) and PT2S (each command); CATEDRA_REDIS_CONNECT_TIMEOUT and
# CATEDRA_REDIS_COMMAND_TIMEOUT override them (ISO-8601 duration).
# The connection to the cátedra Redis is defined in CatedraRedisConfig; plain keys are read, no Redis repositories.
spring.data.redis.repositories.enabled=false
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.catalog-topic=${CATEDRA_KAFKA_CATALOG_TOPIC:}
# The consumer of the catalog topic defaults to PLAINTEXT, auto-offset-reset earliest and PT2M of retries;
# CATEDRA_KAFKA_SECURITY_PROTOCOL, CATEDRA_KAFKA_AUTO_OFFSET_RESET and CATEDRA_KAFKA_RETRY_MAX_ELAPSED_TIME override
# them, and CATEDRA_KAFKA_LISTENER_ENABLED=false leaves it stopped.
# The eventIds of the processed CatalogUpdated are kept P7D to recognize a redelivery (section 18.1);
# CATEDRA_KAFKA_PROCESSED_EVENTS_RETENTION overrides it (ISO-8601 duration).
